defaults:
  model_name:
    - small-omat-0
    - mace-omat-0-medium
    - mace-mpa-0-medium
  outputs_root: ../outputs
  poscar_i: dft_reference/00/POSCAR
  poscar_f: dft_reference/07/POSCAR
  dft_neb_dat: dft_reference/neb.dat
  vasp_inputs_dir: dft_reference
  device: cuda
  dtype: float32
  overwrite: true
  include_vdw: true
  relax_endpoints: false
  remap_f_i: true

workflows:
  neb:
    n_images: 8
    settings:
      fmax_mlip_guess: 0.03
      steps_mlip_guess: 300
      fmax_mlip_d3: 0.03
      steps_mlip_d3: 1400
      fmax_ci: 0.03
      steps_ci: 200
